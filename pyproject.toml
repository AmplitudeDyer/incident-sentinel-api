[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-agent-api"
description = "Mission Brief API powered by Django and PydanticAI"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
dependencies = [
  "Django>=5.1,<5.2",
  "pydantic>=2.11,<3",
  "pydantic-ai>=0.1.0,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "black>=24.4",
  "isort>=5.13",
  "mypy>=1.11",
  "ruff>=0.7",
  "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lumen_agent_api*", "briefs*"]

[tool.black]
line-length = 100
target-version = ["py312", "py313", "py314"]
include = "\.pyi?$"
extend-exclude = "(^|/)migrations/"

[tool.isort]
profile = "black"
line_length = 100
known_django = ["django"]
sections = "FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "ARG",
  "RUF",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"manage.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true
pretty = true

[tool.mypy.overrides]
module = "briefs.*"
strict = true
